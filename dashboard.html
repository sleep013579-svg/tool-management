<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具借出管理系統 - 主畫面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 導覽列 -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">工具借出管理系統</span>
            <div>
                <span class="text-light me-3" id="userGreeting"></span>
                <button id="adminBtn" class="btn btn-warning btn-sm me-2 d-none" onclick="window.location.href='admin.html'">⚙️ 管理後台</button>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">登出</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- 左側區域：借用操作與個人狀態 -->
            <div class="col-md-5 mb-4">
                
                <!-- 借用新工具區塊 (升級為搜尋輸入框) -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">申請借用工具</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">請搜尋或選擇要借出的工具：</label>
                            <!-- 改用 datalist 實現可搜尋的下拉選單 -->
                            <input class="form-control" list="toolsDatalist" id="toolSearchInput" placeholder="點此輸入工具名稱..." autocomplete="off">
                            <datalist id="toolsDatalist">
                                <!-- JS 動態載入 -->
                            </datalist>
                        </div>
                        <button class="btn btn-primary w-100" onclick="borrowTool()">送出借用申請</button>
                    </div>
                </div>

                <!-- 個人已借出清單區塊 -->
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">我的工具與申請狀態</h5>
                    </div>
                    <ul class="list-group list-group-flush" id="myBorrowedList"></ul>
                </div>
            </div>

            <!-- 右側區域：全站工具狀態 -->
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="card-title mb-0">全站工具即時狀態</h5>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle text-center mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>工具名稱</th>
                                    <th>狀態</th>
                                    <th>借出人</th>
                                </tr>
                            </thead>
                            <tbody id="allToolsTableBody">
                                <!-- JS 動態載入 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 共用訊息提示 Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" id="messageModalHeader">
                    <h5 class="modal-title" id="messageModalTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="messageModalBody" class="mb-0 fs-6"></p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">確定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 身分驗證 ---
        const currentUser = localStorage.getItem('currentUser');
        const currentRole = localStorage.getItem('currentRole');
        
        if (!currentUser) {
            alert('系統阻擋：請先登入！');
            window.location.href = 'index.html';
        }

        document.getElementById('userGreeting').innerText = `哈囉，${currentUser}`;
        if (currentRole === 'admin' || currentRole === 'super_admin') {
            document.getElementById('adminBtn').classList.remove('d-none');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            window.location.href = 'index.html';
        }

        // --- 共用訊息 Modal ---
        let msgModalInstance;
        function showMessage(title, message, type = 'success') {
            document.getElementById('messageModalTitle').innerText = title;
            document.getElementById('messageModalBody').innerText = message;
            const header = document.getElementById('messageModalHeader');
            header.className = `modal-header bg-${type} text-white`;
            if(type === 'warning' || type === 'light') header.classList.remove('text-white');
            if (!msgModalInstance) msgModalInstance = new bootstrap.Modal(document.getElementById('messageModal'));
            msgModalInstance.show();
        }

        // 建立一個字典來記錄 名稱對應的ID，方便搜尋後轉換
        let availableToolsMap = {}; 

        // --- 載入工具資料並渲染畫面 ---
        function loadDashboard() {
            fetch('./tools')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderAvailableSearch(data.data);
                        renderMyList(data.data);
                        renderAllToolsTable(data.data);
                    }
                });
        }

        // 1. 渲染可搜尋輸入框
        function renderAvailableSearch(tools) {
            const datalist = document.getElementById('toolsDatalist');
            datalist.innerHTML = '';
            availableToolsMap = {}; // 清空字典
            
            tools.forEach(tool => {
                if (tool.status === 'available') {
                    availableToolsMap[tool.name] = tool.id; // 記錄 ID
                    datalist.innerHTML += `<option value="${tool.name}">`;
                }
            });
        }

        // 2. 渲染個人狀態清單
        function renderMyList(tools) {
            const list = document.getElementById('myBorrowedList');
            list.innerHTML = '';
            let hasMyTools = false;

            tools.forEach(tool => {
                // 如果工具是被我借走的，或者我正在申請歸還中
                if ((tool.status === 'borrowed' || tool.status === 'pending_return') && tool.borrower === currentUser) {
                    hasMyTools = true;
                    
                    let actionHtml = '';
                    if (tool.status === 'borrowed') {
                        actionHtml = `<button class="btn btn-sm btn-outline-warning" onclick="returnTool(${tool.id}, '${tool.name}')">申請歸還</button>`;
                    } else if (tool.status === 'pending_return') {
                        actionHtml = `<span class="badge bg-info text-dark">歸還審核中</span>`;
                    }

                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            ${tool.name}
                            ${actionHtml}
                        </li>
                    `;
                }
            });

            if (!hasMyTools) {
                list.innerHTML = '<li class="list-group-item text-muted text-center p-3">您目前沒有借出或申請中的工具</li>';
            }
        }

        // 3. 渲染全站狀態表格
        function renderAllToolsTable(tools) {
            const tbody = document.getElementById('allToolsTableBody');
            tbody.innerHTML = '';
            
            tools.forEach(tool => {
                // 將四種狀態轉換成對應的 Badge
                let statusBadge = '';
                let borrowerText = tool.borrower || '-';

                switch(tool.status) {
                    case 'available':
                        statusBadge = '<span class="badge bg-success">可借用</span>';
                        break;
                    case 'borrowed':
                        statusBadge = '<span class="badge bg-secondary">已借出</span>';
                        break;
                    case 'pending_borrow':
                        statusBadge = '<span class="badge bg-warning text-dark">借出審核中</span>';
                        break;
                    case 'pending_return':
                        statusBadge = '<span class="badge bg-info text-dark">歸還審核中</span>';
                        break;
                }
                
                tbody.innerHTML += `
                    <tr>
                        <td>${tool.id}</td>
                        <td>${tool.name}</td>
                        <td>${statusBadge}</td>
                        <td>${borrowerText}</td>
                    </tr>
                `;
            });
        }

        // --- 借出申請功能 ---
        function borrowTool() {
            const searchInput = document.getElementById('toolSearchInput');
            const toolName = searchInput.value.trim();
            const toolId = availableToolsMap[toolName];

            if (!toolName) return showMessage('請注意', '請輸入或選擇一項工具！', 'warning');
            if (!toolId) return showMessage('錯誤', '找不到此工具或已被借走，請從選單中挑選！', 'danger');

            fetch('./borrow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ toolId: toolId, toolName: toolName, userName: currentUser })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    searchInput.value = ''; // 清空輸入框
                    showMessage('申請成功', data.message, 'success');
                    loadDashboard(); 
                } else {
                    showMessage('申請失敗', data.message, 'danger');
                }
            });
        }

        // --- 歸還申請功能 ---
        function returnTool(toolId, toolName) {
            fetch('./return', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ toolId: toolId, toolName: toolName, userName: currentUser })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    showMessage('申請成功', data.message, 'success');
                    loadDashboard(); 
                } else {
                    showMessage('申請失敗', data.message, 'danger');
                }
            });
        }

        // 啟動時載入資料
        loadDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具借出管理系統 - 主畫面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">工具借出管理系統</span>
            <div>
                <span class="text-light me-3" id="userGreeting"></span>
                <button id="adminBtn" class="btn btn-warning btn-sm me-2 d-none" onclick="window.location.href='admin.html'">⚙️ 管理後台</button>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">登出</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white"><h5 class="card-title mb-0">申請借用工具</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">請搜尋或選擇要借出的工具：</label>
                            <input class="form-control" list="toolsDatalist" id="toolSearchInput" placeholder="點此輸入工具名稱..." autocomplete="off">
                            <datalist id="toolsDatalist"></datalist>
                        </div>
                        <button class="btn btn-primary w-100" onclick="borrowTool()">送出借用申請</button>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white"><h5 class="card-title mb-0">我的工具與申請狀態</h5></div>
                    <ul class="list-group list-group-flush" id="myBorrowedList"></ul>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white"><h5 class="card-title mb-0">全站工具即時狀態</h5></div>
                    <div class="card-body bg-light border-bottom p-2">
                        <div class="row g-2">
                            <div class="col-4"><input type="text" id="filterName" class="form-control form-control-sm" placeholder="🔍 名稱..." onkeyup="applyFilters()"></div>
                            <div class="col-4">
                                <select id="filterStatus" class="form-select form-select-sm" onchange="applyFilters()">
                                    <option value="all">所有狀態</option>
                                    <option value="available">可借用</option>
                                    <option value="borrowed">已借出</option>
                                    <option value="pending_borrow">借出審核中</option>
                                    <option value="pending_return">歸還審核中</option>
                                    <option value="maintenance">待維修</option>
                                    <option value="damaged">已損壞</option>
                                </select>
                            </div>
                            <div class="col-4"><input type="text" id="filterBorrower" class="form-control form-control-sm" placeholder="👤 借出人..." onkeyup="applyFilters()"></div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle text-center mb-0"><thead class="table-light"><tr><th>序號</th><th>工具名稱</th><th>狀態</th><th>借出人</th></tr></thead><tbody id="allToolsTableBody"></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 💡 共用訊息 Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content"><div class="modal-header" id="messageModalHeader"><h5 class="modal-title" id="messageModalTitle">提示</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center"><p id="messageModalBody" class="mb-0 fs-6"></p></div><div class="modal-footer justify-content-center"><button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">確定</button></div></div></div></div>

    <!-- 💡 確認借用專用 Modal (含圖片預覽) -->
    <div class="modal fade" id="confirmBorrowModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">確認借用</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <p class="mb-2 fs-5">您要申請借用</p>
                    <h4 id="confirmBorrowToolName" class="text-primary fw-bold mb-3"></h4>
                    <!-- 預覽圖片的地方 -->
                    <img id="confirmBorrowToolImage" src="" alt="工具照片" class="img-fluid rounded shadow-sm d-none mb-3" style="max-height: 220px; object-fit: cover;">
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary w-25" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary w-50" id="confirmBorrowBtn" onclick="executeBorrow()">確認送出</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const currentUser = localStorage.getItem('currentUser');
        const currentRole = localStorage.getItem('currentRole');
        
        if (!currentUser) { alert('系統阻擋：請先登入！'); window.location.href = 'index.html'; }

        document.getElementById('userGreeting').innerText = `哈囉，${currentUser}`;
        if (currentRole === 'admin' || currentRole === 'super_admin') {
            document.getElementById('adminBtn').classList.remove('d-none');
        }

        function logout() { localStorage.removeItem('currentUser'); localStorage.removeItem('currentRole'); window.location.href = 'index.html'; }

        let msgModalInstance;
        function showMessage(title, message, type = 'success') {
            document.getElementById('messageModalTitle').innerText = title;
            document.getElementById('messageModalBody').innerText = message;
            const header = document.getElementById('messageModalHeader');
            header.className = `modal-header bg-${type} text-white`;
            if(type === 'warning' || type === 'light') header.classList.remove('text-white');
            if (!msgModalInstance) msgModalInstance = new bootstrap.Modal(document.getElementById('messageModal'));
            msgModalInstance.show();
        }

        let availableToolsMap = {}; 
        let allToolsData = []; 

        function loadDashboard() {
            fetch('./tools').then(res => res.json()).then(data => {
                if (data.success) {
                    allToolsData = data.data; 
                    renderAvailableSearch(data.data);
                    renderMyList(data.data);
                    applyFilters(); 
                }
            });
        }

        function applyFilters() {
            try {
                const nameKeyword = (document.getElementById('filterName').value || '').trim().toLowerCase();
                const statusFilter = document.getElementById('filterStatus').value;
                const borrowerKeyword = (document.getElementById('filterBorrower').value || '').trim().toLowerCase();

                const filteredTools = allToolsData.filter(tool => {
                    const matchName = (tool.name || '').toLowerCase().includes(nameKeyword);
                    const matchStatus = (statusFilter === 'all') || (tool.status === statusFilter);
                    const matchBorrower = (tool.borrower || '').toLowerCase().includes(borrowerKeyword);
                    return matchName && matchStatus && matchBorrower;
                });
                renderAllToolsTable(filteredTools);
            } catch (error) { console.error("篩選錯誤：", error); }
        }

        function renderAvailableSearch(tools) {
            const datalist = document.getElementById('toolsDatalist'); datalist.innerHTML = ''; availableToolsMap = {}; 
            tools.forEach(tool => {
                if (tool.status === 'available') { availableToolsMap[tool.name] = tool.id; datalist.innerHTML += `<option value="${tool.name}">`; }
            });
        }

        function renderMyList(tools) {
            const list = document.getElementById('myBorrowedList'); list.innerHTML = ''; let hasMyTools = false;
            tools.forEach(tool => {
                if ((tool.status === 'borrowed' || tool.status === 'pending_return') && tool.borrower === currentUser) {
                    hasMyTools = true;
                    let actionHtml = tool.status === 'borrowed' ? `<button class="btn btn-sm btn-outline-warning" onclick="returnTool(${tool.id}, '${tool.name}')">申請歸還</button>` : `<span class="badge bg-info text-dark">歸還審核中</span>`;
                    list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">${tool.name} ${actionHtml}</li>`;
                }
            });
            if (!hasMyTools) list.innerHTML = '<li class="list-group-item text-muted text-center p-3">您目前沒有借出或申請中的工具</li>';
        }

        function renderAllToolsTable(tools) {
            const tbody = document.getElementById('allToolsTableBody'); tbody.innerHTML = '';
            tools.forEach((tool, index) => {
                let statusBadge = ''; let nameDisplay = tool.name; 
                switch(tool.status) {
                    case 'available': 
                        statusBadge = '<span class="badge bg-success">可借用</span>'; 
                        // 💡 點擊純名稱按鈕觸發 Modal (只傳遞 ID)
                        nameDisplay = `<button class="btn btn-sm btn-outline-primary fw-bold w-100 shadow-sm" onclick="openConfirmBorrowModal(${tool.id})">${tool.name}</button>`;
                        break;
                    case 'borrowed': statusBadge = '<span class="badge bg-secondary">已借出</span>'; break;
                    case 'pending_borrow': statusBadge = '<span class="badge bg-warning text-dark">借出審核中</span>'; break;
                    case 'pending_return': statusBadge = '<span class="badge bg-info text-dark">歸還審核中</span>'; break;
                    case 'maintenance': statusBadge = '<span class="badge bg-danger">待維修</span>'; break;
                    case 'damaged': statusBadge = '<span class="badge bg-dark">已損壞</span>'; break;
                    default: statusBadge = `<span class="badge bg-light text-dark">${tool.status}</span>`;
                }
                tbody.innerHTML += `<tr><td>${index + 1}</td><td class="align-middle">${nameDisplay}</td><td class="align-middle">${statusBadge}</td><td class="align-middle">${tool.borrower || '-'}</td></tr>`;
            });
        }

        // ==========================================
        //          彈窗與直接借用邏輯
        // ==========================================
        let confirmBorrowModalInstance;
        let selectedToolId = null;
        let selectedToolName = '';

        // 💡 根據傳入的 ID，動態載入工具名稱與照片
        function openConfirmBorrowModal(id) {
            const tool = allToolsData.find(t => t.id === id);
            if (!tool) return;

            selectedToolId = tool.id;
            selectedToolName = tool.name;
            document.getElementById('confirmBorrowToolName').innerText = tool.name;
            
            // 處理照片顯示
            const imgElement = document.getElementById('confirmBorrowToolImage');
            if (tool.image) {
                imgElement.src = tool.image;
                imgElement.classList.remove('d-none');
            } else {
                imgElement.src = '';
                imgElement.classList.add('d-none');
            }
            
            if (!confirmBorrowModalInstance) confirmBorrowModalInstance = new bootstrap.Modal(document.getElementById('confirmBorrowModal'));
            confirmBorrowModalInstance.show();
        }

        function executeBorrow() {
            const btn = document.getElementById('confirmBorrowBtn');
            btn.disabled = true; btn.innerText = '處理中...'; // 防連點鎖定

            fetch('./borrow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ toolId: selectedToolId, toolName: selectedToolName, userName: currentUser })
            }).then(res => res.json()).then(data => {
                confirmBorrowModalInstance.hide(); 
                btn.disabled = false; btn.innerText = '確認送出';
                if (data.success) { showMessage('申請成功', data.message, 'success'); loadDashboard(); } 
                else { showMessage('申請失敗', data.message, 'danger'); }
            }).catch(() => {
                btn.disabled = false; btn.innerText = '確認送出';
                showMessage('連線錯誤', '無法連線到伺服器！', 'danger');
            });
        }

        function borrowTool() {
            const searchInput = document.getElementById('toolSearchInput');
            const toolName = searchInput.value.trim();
            const toolId = availableToolsMap[toolName];

            if (!toolName) return showMessage('請注意', '請輸入或選擇一項工具！', 'warning');
            if (!toolId) return showMessage('錯誤', '找不到此工具或已被借走，請從選單中挑選！', 'danger');

            fetch('./borrow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ toolId, toolName, userName: currentUser })
            }).then(res => res.json()).then(data => {
                if (data.success) { searchInput.value = ''; showMessage('申請成功', data.message, 'success'); loadDashboard(); } 
                else { showMessage('申請失敗', data.message, 'danger'); }
            });
        }

        function returnTool(toolId, toolName) {
            fetch('./return', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ toolId, toolName, userName: currentUser }) })
            .then(res => res.json()).then(data => {
                if (data.success) { showMessage('申請成功', data.message, 'success'); loadDashboard(); } 
                else { showMessage('申請失敗', data.message, 'danger'); }
            });
        }

        loadDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具借出管理系統 - 登入與註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <h3 class="text-center mb-4">工具借出管理系統</h3>
            
            <form id="loginForm">
                <!-- 改為手動輸入使用人名稱 -->
                <!-- 可輸入的下拉式選單 -->
                <div class="mb-3">
                    <label for="nameInput" class="form-label">選擇或輸入使用者名稱</label>
                    <!-- list 屬性必須對應到下方 datalist 的 id -->
                    <input class="form-control" list="userOptions" id="nameInput" placeholder="請點擊選擇或輸入名稱搜尋..." required autocomplete="off">
                    <datalist id="userOptions">
                        <!-- 這裡的選單內容之後會由腳本自動載入 -->
                    </datalist>
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">登入系統</button>
            </form>
            
            <!-- 註冊按鈕 (觸發彈跳視窗) -->
            <div class="text-center mt-3">
                <span class="text-muted">還沒有帳號嗎？</span>
                <button type="button" class="btn btn-link p-0 align-baseline" data-bs-toggle="modal" data-bs-target="#registerModal">註冊新帳號</button>
            </div>
        </div>
    </div>

    <!-- 註冊用的彈跳視窗 (Modal) -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">註冊新帳號</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regNameInput" class="form-label">設定名稱</label>
                            <input type="text" class="form-control" id="regNameInput" placeholder="例如：新員工小趙" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPasswordInput" class="form-label">設定密碼</label>
                            <input type="password" class="form-control" id="regPasswordInput" placeholder="請設定密碼" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-3">確認註冊</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 必須引入 Bootstrap 的 JS 才能讓彈跳視窗運作 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 網頁載入時，自動抓取名單建立下拉選單 ---
function loadUserList() {
    fetch('./users')
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            const datalist = document.getElementById('userOptions');
            datalist.innerHTML = ''; // 先清空舊選單
            
            // 將後端傳來的名字，一筆一筆加入選單中
            data.data.forEach(user => {
                const option = document.createElement('option');
                option.value = user.name;
                datalist.appendChild(option);
            });
        }
    })
    .catch(() => console.error('無法載入人員名單'));
}

// 網頁一打開就執行一次
loadUserList();

// --- 登入功能 ---
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); 
    const name = document.getElementById('nameInput').value;
    const password = document.getElementById('passwordInput').value;

    fetch('./login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            localStorage.setItem('currentUser', data.name);
            localStorage.setItem('currentRole', data.role);
            window.location.href = 'dashboard.html'; 
        } else {
            alert(`登入失敗：${data.message}`);
        }
    })
    .catch(() => alert('無法連線到伺服器！'));
});

// --- 註冊功能 ---
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const regName = document.getElementById('regNameInput').value;
    const regPassword = document.getElementById('regPasswordInput').value;

    fetch('./register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: regName, password: regPassword })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            alert(data.message);
            var myModalEl = document.getElementById('registerModal');
            var modal = bootstrap.Modal.getInstance(myModalEl);
            modal.hide();
            document.getElementById('registerForm').reset();
            
            // 註冊成功後，立刻重新載入選單，這樣新註冊的人就可以馬上被搜尋到！
            loadUserList(); 
        } else {
            alert(`註冊失敗：${data.message}`);
        }
    })
    .catch(() => alert('無法連線到伺服器！'));
});
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具借出管理系統 - 登入與註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">
            <h3 class="text-center mb-4">工具借出管理系統</h3>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="nameInput" class="form-label">選擇或輸入使用者名稱</label>
                    <input class="form-control" list="userOptions" id="nameInput" placeholder="請點擊選擇或輸入名稱搜尋..." required autocomplete="off">
                    <datalist id="userOptions"></datalist>
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label">密碼</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">登入系統</button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-muted">還沒有帳號嗎？</span>
                <button type="button" class="btn btn-link p-0 align-baseline" data-bs-toggle="modal" data-bs-target="#registerModal">註冊新帳號</button>
            </div>
        </div>
    </div>

    <!-- 註冊 Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">註冊新帳號</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regNameInput" class="form-label">設定名稱</label>
                            <input type="text" class="form-control" id="regNameInput" placeholder="例如：新員工小趙" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPasswordInput" class="form-label">設定密碼</label>
                            <input type="password" class="form-control" id="regPasswordInput" placeholder="請設定密碼" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-3">確認註冊</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ★ 新增：共用訊息提示 Modal ★ -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" id="messageModalHeader">
                    <h5 class="modal-title" id="messageModalTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="messageModalBody" class="mb-0 fs-6"></p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">確定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 核心：共用訊息視窗觸發函數 ---
        let msgModalInstance;
        function showMessage(title, message, type = 'primary') {
            document.getElementById('messageModalTitle').innerText = title;
            document.getElementById('messageModalBody').innerText = message;
            
            // 根據類型改變標題顏色
            const header = document.getElementById('messageModalHeader');
            header.className = `modal-header bg-${type} text-white`;
            
            // 如果是淺色背景(如 warning, info)，調整按鈕叉叉的顏色 (非必要，但較美觀)
            if(type === 'warning' || type === 'light') {
                header.classList.remove('text-white');
            }

            if (!msgModalInstance) {
                msgModalInstance = new bootstrap.Modal(document.getElementById('messageModal'));
            }
            msgModalInstance.show();
        }

        // --- 載入名單 ---
        function loadUserList() {
            fetch('./users')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const datalist = document.getElementById('userOptions');
                    datalist.innerHTML = ''; 
                    data.data.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.name;
                        datalist.appendChild(option);
                    });
                }
            })
            .catch(() => console.error('無法載入人員名單'));
        }

        loadUserList();

        // --- 登入功能 ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const name = document.getElementById('nameInput').value;
            const password = document.getElementById('passwordInput').value;

            fetch('./login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    localStorage.setItem('currentUser', data.name);
                    localStorage.setItem('currentRole', data.role);
                    window.location.href = 'dashboard.html'; 
                } else {
                    // 使用精美視窗取代 alert
                    showMessage('登入失敗', data.message, 'danger');
                }
            })
            .catch(() => showMessage('連線錯誤', '無法連線到伺服器！', 'danger'));
        });

        // --- 註冊功能 ---
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const regName = document.getElementById('regNameInput').value;
            const regPassword = document.getElementById('regPasswordInput').value;

            fetch('./register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: regName, password: regPassword })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    var myModalEl = document.getElementById('registerModal');
                    var modal = bootstrap.Modal.getInstance(myModalEl);
                    modal.hide();
                    document.getElementById('registerForm').reset();
                    
                    loadUserList(); 
                    
                    // 使用精美視窗顯示註冊成功
                    showMessage('註冊成功', data.message, 'success');

                } else {
                    // 使用精美視窗顯示註冊失敗
                    showMessage('註冊失敗', data.message, 'danger');
                }
            })
            .catch(() => showMessage('連線錯誤', '無法連線到伺服器！', 'danger'));
        });
    </script>
</body>
</html>
